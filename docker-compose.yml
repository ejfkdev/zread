# Company-wide zread MCP service.
#
# Configure once in .env (see .env.example), then:
#   docker compose up -d
#
# Every engineer / AI agent connects to the shared endpoint:
#   http://<your-host>:8708/mcp
#
#   zread install claude-code --url http://<your-host>:8708/mcp
#   zread install codex       --url http://<your-host>:8708/mcp
#   zread install hermes      --url http://<your-host>:8708/mcp

services:
  zread-mcp:
    build: .
    image: zread-mcp:latest
    container_name: zread-mcp
    restart: unless-stopped
    ports:
      - "${ZREAD_MCP_PORT:-8708}:8708"
    environment:
      # Optional GitHub token: raises GitHub API rate limits and enables
      # private repositories. Everything works without it on public repos.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ZREAD_LANG: ${ZREAD_LANG:-en}
