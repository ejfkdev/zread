# Company-wide zread MCP + AI Q&A service.
#
# Configure once in .env (see .env.example), then:
#   docker compose up -d
#
# Every engineer / AI agent connects to the shared endpoints:
#   MCP (docs/code):  http://<your-host>:8708/mcp
#   AI Q&A (RAG):     http://<your-host>:8709
#
#   zread install claude-code --url http://<your-host>:8708/mcp
#   zread install codex       --url http://<your-host>:8708/mcp
#   ZREAD_AI_BACKEND_URL=http://<your-host>:8709 zread ai golang/go "How do goroutines work?"

services:
  zread-mcp:
    build: .
    image: zread-mcp:latest
    container_name: zread-mcp
    restart: unless-stopped
    ports:
      - "${ZREAD_MCP_PORT:-8708}:8708"
    environment:
      # Optional GitHub token: raises GitHub API rate limits and enables
      # private repositories. Everything works without it on public repos.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ZREAD_LANG: ${ZREAD_LANG:-en}

  zread-ai:
    build: ./backend
    image: zread-ai:latest
    container_name: zread-ai
    restart: unless-stopped
    ports:
      - "${ZREAD_AI_PORT:-8709}:8709"
    environment:
      # The backend has its own GitHub token (independent of the MCP client).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Shared secret required on every /api/v1 request. Set this for any
      # network-exposed deployment; the client must send the same value via
      # ZREAD_AI_API_KEY. Leave empty only for local dev (API is then open).
      BACKEND_API_KEY: ${ZREAD_BACKEND_API_KEY:-}
      # OpenAI-compatible LLM (chat). See backend/.env.example for examples.
      ZREAD_LLM_BASE_URL: ${ZREAD_LLM_BASE_URL:-https://api.openai.com/v1}
      ZREAD_LLM_API_KEY: ${ZREAD_LLM_API_KEY:-}
      ZREAD_LLM_MODEL: ${ZREAD_LLM_MODEL:-gpt-4o-mini}
      # Embeddings (optional separate provider; defaults to chat endpoint).
      ZREAD_EMBED_BASE_URL: ${ZREAD_EMBED_BASE_URL:-}
      ZREAD_EMBED_API_KEY: ${ZREAD_EMBED_API_KEY:-}
      ZREAD_EMBED_MODEL: ${ZREAD_EMBED_MODEL:-text-embedding-3-small}
      ZREAD_EMBED_DIM: ${ZREAD_EMBED_DIM:-1536}
    volumes:
      # Persistent storage for the SQLite DB + vector embeddings.
      - zread-ai-data:/app/data

volumes:
  zread-ai-data:
