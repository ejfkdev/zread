[project]
name = "zread"
version = "2.0.4"
description = "Zread 让你和你的 AI 都更懂代码。代码不用看，直接问。连接 zread.ai，AI 驱动的 GitHub 项目文档。"
readme = "README.md"
authors = [
    { name = "ejfkdev", email = "152914458+ejfkdev@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "fastmcp>=3.0.0",
    "typer>=0.9.0",
    "arrow>=1.3.0",
    "darkdetect>=0.8.0",
    "python-i18n>=0.3.9",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "textual-image>=0.2.0",
    "typing-extensions>=4.8.0",
]

license = { text = "MIT" }
keywords = ["mcp", "context-protocol", "github", "ai", "zread"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["zread.py", "locales/**/*.yml"]

[project.scripts]
zread = "zread:main"

[project.urls]
Homepage = "https://github.com/ejfkdev/zread"
Repository = "https://github.com/ejfkdev/zread"
Issues = "https://github.com/ejfkdev/zread/issues"
