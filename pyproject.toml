[project]
name = "zread"
dynamic = ["version"]
description = "Standalone GitHub docs & code reader for your terminal and AI agents (CLI + MCP server). Reads repository docs and source straight from GitHub — no account, no external service."
readme = "README.md"
authors = [
    { name = "ejfkdev", email = "152914458+ejfkdev@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "fastmcp>=3.1.0",
    "typer>=0.24.0",
    "arrow>=1.4.0",
    "darkdetect>=0.8.0",
    "python-i18n>=0.3.9",
    "rich>=14.0.0",
    "Pillow>=12.0.0",
    "textual-image>=0.12.0",
    "typing-extensions>=4.15.0",
    'tomli>=2.0.0; python_version < "3.11"',
]

license = { text = "MIT" }
keywords = ["mcp", "context-protocol", "github", "ai", "zread"]

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zread"]

[tool.setuptools.package-data]
zread = ["locales/**/*.yml"]

[tool.setuptools_scm]
write_to = "zread_version.py"
local_scheme = "no-local-version"

[project.scripts]
zread = "zread:main"

[project.urls]
Homepage = "https://github.com/valeriikot/zread"
Repository = "https://github.com/valeriikot/zread"
Issues = "https://github.com/valeriikot/zread/issues"
