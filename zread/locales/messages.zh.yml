    tree_summary: 显示 %{shown} / %{total} 个文件
    releases_none: 暂无 Releases
    exporting_repo: 📦 正在导出：%{repo}
    output_dir: 📁 输出目录：%{path}
    language_label: 🌐 语言：%{lang_code}
    concurrency_label: ⚡ 并发数：%{concurrency}
    export_complete: ✅ 导出完成！
    export_total: '   总计：%{count} 个文件'
