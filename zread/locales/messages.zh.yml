    invalid_repo_format: 请使用 owner/repo 格式，例如：openclaw/openclaw
    file_not_found_or_inaccessible: 文件不存在或无法访问
    parse_repo_and_file_failed: 错误：无法解析仓库路径和文件路径
    parse_repo_url_failed: 无法解析仓库路径：%{input}（请使用 owner/repo 或完整 GitHub URL）
    fetch_file_content: 错误：无法获取文件内容
    fetch_repo_outline_failed: ❌ 获取仓库目录失败
