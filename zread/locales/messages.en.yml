en:
  cli:
    app_help: 'Zread helps you and your AI understand code better. Skip the source dive and ask directly.

      https://github.com/valeriikot/zread'
    env_vars_title: Environment Variables
    env_var_lang_desc: Default language (zh/en), lower priority than --lang and higher than system locale
    env_var_github_token_desc: Optional GitHub token for higher API rate limits and private repos
    show_version: Show version
    show_help: Show help
    commands:
      mcp: Start the MCP server
      ls: Show the documentation outline
      cat: Read a repository's docs or source files from GitHub
      find: Search GitHub repositories, or search keywords inside a repository's docs
      top: Show trending repositories
      rand: Discover a recommended repository at random
      stat: Show repository information
      cp: Export repository docs locally and generate llms.txt / llms-full.txt
      install: Configure the zread MCP server for an AI coding agent (Claude Code / Codex / Hermes)
    args:
      transport: 'Transport protocol: stdio / sse / http'
      address: 'Address formats: host, host:port, :port, host:port/path, :port/path (default: 127.0.0.1:8708)'
      repo: Repository path in owner/repo format
      repo_optional: Repository path (optional, owner/repo)
      repo_or_url: Repository path (owner/repo) or GitHub URL
      path_or_slug: 'Doc/file path (for example README.md, docs/guide.md); default: README'
      cat_extra: 'Optional: file path, start line, or line range (for example 5, 5:20, Lib/http/client.py)'
      query: Search keyword
      weeks: How many recent weeks of rankings to show
      topic_optional: GitHub topic tag such as python, awesome-list, or agent-skills (optional)
      output_dir: 'Output directory (default: current directory)'
      agent: 'Target agent: claude-code / codex / hermes'
    options:
      lang: 'Language: zh / en'
      json: Output as JSON
      plain: Output plain text
      concurrency: 'Concurrency (default: 10)'
      print_only: Print the configuration only, without modifying anything
      mcp_url: URL of a shared zread MCP server (HTTP mode), e.g. http://zread.internal:8708/mcp — the agent connects there instead of running a local process
  status:
    fetch_outline: Fetching documentation outline...
    fetch_page: Fetching page content...
    locate_default_page: Locating the default page...
    fetch_repo_info: Fetching repository information...
    fetch_file_content: Fetching file content...
    search_docs: Searching documentation...
    search_repos: Searching repositories...
    fetch_trending: Fetching trending repositories...
    fetch_recommend: Fetching recommended repositories...
    downloading_repo: 📥 Downloading %{repo}...
  errors:
    missing_repo: 'Missing required argument: REPO (repository path in owner/repo format)'
    missing_repo_or_url: 'Missing required argument: REPO_OR_URL (repository path or GitHub URL)'
    missing_query: 'Missing required argument: QUERY (search keyword)'
    missing_agent: 'Missing required argument: AGENT (claude-code / codex / hermes)'
    fetch_outline: 'Error: unable to fetch the documentation outline'
    fetch_repo_outline: 'Error: unable to fetch the repository outline'
    fetch_page: 'Error: unable to fetch the page content'
    page_number_not_found: 'Error: could not find page number %{number}'
    page_missing_slug: 'Error: page %{number} is missing a slug'
    fetch_repo_info: 'Error: unable to fetch repository information'
    repo_not_found: 'Error: unable to fetch repository information, repository not found'
    search_failed: Search failed
    fetch_trending: Unable to fetch trending repositories
    fetch_recommend: Unable to fetch recommended repositories
    export_failed_with_reason: '❌ Export failed: %{error}'
    http_request_failed: HTTP request failed
