en:
  cli:
    app_help: "Zread helps you and your AI understand code better. Skip the source dive and ask directly.\nhttps://github.com/ejfkdev/zread"
    env_vars_title: "Environment Variables"
    env_var_token_desc: "JWT token from your zread.ai account login, only required for AI chat"
    env_var_lang_desc: "Default language (zh/en), lower priority than --lang and higher than system locale"
    env_var_model_desc: "Default AI model (glm-5.1/claude-sonnet-4.6), lower priority than --model"
    show_version: "Show version"
    show_help: "Show help"
    commands:
      mcp: "Start the MCP server"
      ls: "Show the documentation outline"
      cat: "Read repository content from zread docs pages or GitHub files"
      find: "Search GitHub repositories, or search keywords inside a repository's docs"
      top: "Show trending repositories"
      rand: "Discover a recommended repository at random"
      stat: "Show repository information"
      ai: "Ask the repository AI a question (token required)"
      cp: "Export repository docs locally and generate llms.txt / llms-full.txt"
      install: "Configure the zread MCP server for an AI coding agent (Claude Code / Codex / Hermes)"
    args:
      transport: "Transport protocol: stdio / sse / http"
      address: "Address formats: host, host:port, :port, host:port/path, :port/path (default: 127.0.0.1:8708)"
      repo: "Repository path in owner/repo format"
      repo_optional: "Repository path (optional, owner/repo)"
      repo_or_url: "Repository path (owner/repo) or GitHub URL"
      path_or_slug: "zread slug (for example 1-overview) or file path (for example README.md), default: 1-overview"
      cat_extra: "Optional: file path, start line, or line range (for example 5, 5:20, Lib/http/client.py)"
      query: "Search keyword"
      weeks: "How many recent weeks of rankings to show"
      topic_optional: "GitHub topic tag such as python, awesome-list, or agent-skills (optional)"
      question_optional: "Question (optional, enters interactive mode when omitted)"
      output_dir: "Output directory (default: current directory)"
      agent: "Target agent: claude-code / codex / hermes"
    options:
      token: "ZREAD_TOKEN"
      lang: "Language: zh / en"
      json: "Output as JSON"
      plain: "Output plain text"
      ai_plain: "Stream only the answer body"
      ai_json: "Return reasoning and answer in one final JSON object"
      model: "Model: glm-5.1 or claude-sonnet-4.6 (default glm-5.1, can be set via ZREAD_MODEL env var or config file)"
      concurrency: "Concurrency (default: 10)"
      print_only: "Print the configuration only, without modifying anything"
