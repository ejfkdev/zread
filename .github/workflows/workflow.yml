name: Release Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref_name:
        description: Release tag to validate and publish, for example v2.0.2
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      ref_name: ${{ steps.meta.outputs.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.ref_name }}

      - name: Resolve release metadata
        id: meta
        run: |
          echo "ref_name=${{ github.event.release.tag_name || inputs.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Validate release version
        run: python scripts/check_release_version.py --ref-name "${{ steps.meta.outputs.ref_name }}"

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zread
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
